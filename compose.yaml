services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vulnerable_api_lab
      POSTGRES_USER: lab_user
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:?Set LAB_DB_PASSWORD in the local .env file}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - lab_pg_data:/var/lib/postgresql/data
      - ./db/seed.sql:/docker-entrypoint-initdb.d/001_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_user -d vulnerable_api_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lab_pg_data:
